<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViralFlow AI - Intelligent Video Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      padding-top: 40px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.2em;
      color: #00d9ff;
      margin-bottom: 30px;
    }

    .upload-section {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #00d9ff;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      margin-bottom: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .upload-section:hover {
      background: rgba(0, 217, 255, 0.1);
      border-color: #00ffff;
    }

    .upload-section.dragover {
      background: rgba(0, 217, 255, 0.2);
      border-color: #00ffff;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 3em;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 1.1em;
      margin-bottom: 10px;
    }

    .upload-hint {
      font-size: 0.9em;
      color: #00d9ff;
      opacity: 0.7;
    }

    input[type="file"] {
      display: none;
    }

    .button {
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      color: #000;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .progress-section {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
    }

    .progress-section.active {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d9ff, #0099cc);
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
    }

    .status-text {
      text-align: center;
      margin: 15px 0;
      color: #00d9ff;
      font-size: 0.95em;
    }

    .results-section {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
    }

    .results-section.active {
      display: block;
    }

    .results-title {
      font-size: 1.5em;
      margin-bottom: 20px;
      color: #00d9ff;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .analysis-card {
      background: rgba(0, 217, 255, 0.1);
      border: 1px solid #00d9ff;
      border-radius: 8px;
      padding: 20px;
    }

    .card-title {
      font-size: 1.1em;
      color: #00ffff;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .card-content {
      font-size: 0.9em;
      line-height: 1.6;
      color: #ccc;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .stat-box {
      background: rgba(0, 217, 255, 0.1);
      border-left: 3px solid #00d9ff;
      padding: 15px;
      border-radius: 4px;
    }

    .stat-label {
      font-size: 0.85em;
      color: #00d9ff;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.5em;
      color: #fff;
      font-weight: 600;
    }

    .download-button {
      background: linear-gradient(135deg, #00ff88, #00cc66);
      color: #000;
      padding: 15px 30px;
      border-radius: 6px;
      border: none;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
    }

    .download-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
    }

    .error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #ff0000;
      color: #ff6666;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
      display: none;
    }

    .error.active {
      display: block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0, 217, 255, 0.3);
      border-top: 3px solid #00d9ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✨ ViralFlow AI</h1>
      <p class="subtitle">Intelligent Video Editor - Eliminate Editing</p>
    </header>

    <div class="error" id="errorBox"></div>

    <div class="upload-section" id="uploadSection">
      <div class="upload-icon">📹</div>
      <div class="upload-text">Drag your video here or click to select</div>
      <div class="upload-hint">Supports MP4, WebM, MOV (up to 500MB)</div>
      <input type="file" id="videoInput" accept="video/*">
      <button class="button" onclick="document.getElementById('videoInput').click()">Select Video</button>
    </div>

    <div class="progress-section" id="progressSection">
      <div class="status-text">
        <span class="spinner"></span>
        <span id="statusText">Uploading...</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="status-text" id="progressText">0%</div>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="results-title">✅ Processing Complete</div>
      
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Input Size</div>
          <div class="stat-value" id="inputSize">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Output Size</div>
          <div class="stat-value" id="outputSize">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Compression</div>
          <div class="stat-value" id="compression">-</div>
        </div>
      </div>

      <div class="results-title" style="margin-top: 30px;">Detected Moments</div>
      <div class="analysis-grid" id="analysisGrid"></div>

      <button class="download-button" id="downloadButton">⬇️ Download Processed Video</button>
    </div>
  </div>

  <script>
    const uploadSection = document.getElementById('uploadSection');
    const progressSection = document.getElementById('progressSection');
    const resultsSection = document.getElementById('resultsSection');
    const videoInput = document.getElementById('videoInput');
    const errorBox = document.getElementById('errorBox');
    let currentVideoId = null;
    let currentOutputFile = null;

    // Drag and drop
    uploadSection.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadSection.classList.add('dragover');
    });

    uploadSection.addEventListener('dragleave', () => {
      uploadSection.classList.remove('dragover');
    });

    uploadSection.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadSection.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        videoInput.files = files;
        uploadVideo();
      }
    });

    videoInput.addEventListener('change', uploadVideo);

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('active');
      setTimeout(() => errorBox.classList.remove('active'), 5000);
    }

    async function uploadVideo() {
      const file = videoInput.files[0];
      if (!file) return;

      uploadSection.style.display = 'none';
      progressSection.classList.add('active');
      resultsSection.classList.remove('active');

      const formData = new FormData();
      formData.append('video', file);

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Upload failed');
        }

        const data = await response.json();
        currentVideoId = data.videoId;
        currentOutputFile = data.outputFile;

        // Simulate progress
        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.random() * 30;
          if (progress > 90) progress = 90;
          updateProgress(progress);
          if (progress >= 90) clearInterval(interval);
        }, 300);

        // Show results after delay
        setTimeout(() => {
          clearInterval(interval);
          updateProgress(100);
          showResults(data);
        }, 2000);
      } catch (error) {
        showError('Error uploading video: ' + error.message);
        uploadSection.style.display = 'block';
        progressSection.classList.remove('active');
      }
    }

    function updateProgress(percent) {
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('progressText').textContent = Math.round(percent) + '%';
    }

    function showResults(data) {
      progressSection.classList.remove('active');
      resultsSection.classList.add('active');

      // Update stats
      document.getElementById('inputSize').textContent = formatBytes(data.inputSize);
      document.getElementById('outputSize').textContent = formatBytes(data.outputSize);
      document.getElementById('compression').textContent = data.compression;

      // Show moments
      const analysisGrid = document.getElementById('analysisGrid');
      analysisGrid.innerHTML = '';
      
      if (data.analysis && data.analysis.moments) {
        data.analysis.moments.forEach(moment => {
          const card = document.createElement('div');
          card.className = 'analysis-card';
          card.innerHTML = `
            <div class="card-title">${moment.type}</div>
            <div class="card-content">
              <strong>Time:</strong> ${moment.time}<br>
              <strong>Emotion:</strong> ${moment.emotion}<br>
              <strong>Effects:</strong> ${moment.effects.join(', ')}
            </div>
          `;
          analysisGrid.appendChild(card);
        });
      }
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    document.getElementById('downloadButton').addEventListener('click', () => {
      if (currentOutputFile) {
        window.location.href = `/api/download/${currentOutputFile}`;
      }
    });
  </script>
</body>
</html>
